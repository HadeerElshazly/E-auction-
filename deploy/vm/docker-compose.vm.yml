# The demo on auctions.westus2.cloudapp.azure.com (4 vCPU, 16 GiB).
#
# An override on deploy/compose/docker-compose.yml, not a replacement: the base
# file stays the one a developer runs locally, and everything here is the
# difference between a laptop and a host on the public internet.
#
#   docker compose -f ../compose/docker-compose.yml -f docker-compose.vm.yml up -d
#
# What the difference actually is:
#
#   * One hostname instead of eleven ports. The edge (nginx-edge.conf) serves
#     the bidder portal, the eight APIs, Keycloak and the sandbox on :80, and
#     the admin portal on :8081. Only those two need a firewall rule.
#
#   * The portals are rebuilt. Vite inlines the API URLs and the
#     Content-Security-Policy is generated from the same table in the same
#     build, so a bundle built for localhost cannot be pointed at this host at
#     runtime (D-43) — the image is specific to the environment.
#
#   * Keycloak moves to /auth and mints its URLs on the public name, so the
#     `iss` in every token is the public issuer. Each service keeps fetching
#     signing keys over the container network (Jwt__Authority) and accepts the
#     public issuer as well (Jwt__Issuer) — additive, which is why both work.
#
#   * The keys the base file hard-codes come from .env. Those literals are fine
#     on a laptop and not on a host anyone can reach: deploy.sh generates them
#     once and never regenerates them, because rotating the grant key
#     invalidates every grant already issued and rotating the bidder master key
#     makes every signing key a browser holds wrong.
#
#   * Everything restarts with the VM, except the one-shot provisioning jobs.
#
# A note on the ports the base file publishes. Compose concatenates `ports`
# across files, so an override cannot withdraw them — 5080, 5090 and the rest
# stay bound on the VM. The network security group is the boundary that matters:
# open 80 and 8081 and nothing else, and do not widen it to 0.0.0.0/0, because
# this stack runs a payment simulator that settles every charge for free.
services:
  provision-migrate:
    environment:
      Admin__BidderMasterKeyHex: ${BIDDER_MASTER_KEY}
      ConnectionStrings__Admin: "Host=postgres;Database=eauction;Username=eauction;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Participant: "Host=postgres;Database=eauction_participant;Username=eauction;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Notifications: "Host=postgres;Database=eauction_notifications;Username=eauction;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Audit: "Host=postgres;Database=eauction_audit;Username=eauction;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Reporting: "Host=postgres;Database=eauction_reporting;Username=eauction;Password=${POSTGRES_PASSWORD}"
  auction-admin:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com,https://auctions.westus2.cloudapp.azure.com:8081
      Admin__BidderMasterKeyHex: ${BIDDER_MASTER_KEY}
      Documents__GrantKeyHex: ${DOCUMENT_GRANT_KEY}
      ConnectionStrings__Admin: "Host=postgres;Database=eauction;Username=eauction;Password=${POSTGRES_PASSWORD}"
    restart: unless-stopped
  participant:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com,https://auctions.westus2.cloudapp.azure.com:8081
      Participant__BidderMasterKeyHex: ${BIDDER_MASTER_KEY}
      Documents__GrantKeyHex: ${DOCUMENT_GRANT_KEY}
      ConnectionStrings__Participant: "Host=postgres;Database=eauction_participant;Username=eauction;Password=${POSTGRES_PASSWORD}"
    restart: unless-stopped
  bid-catcher:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com,https://auctions.westus2.cloudapp.azure.com:8081
      Catcher__BidderMasterKeyHex: ${BIDDER_MASTER_KEY}
      Catcher__ReceiptKeyHex: ${BID_RECEIPT_KEY}
    restart: unless-stopped
  query-bff:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com,https://auctions.westus2.cloudapp.azure.com:8081
    restart: unless-stopped
  documents:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com,https://auctions.westus2.cloudapp.azure.com:8081
      Documents__GrantKeyHex: ${DOCUMENT_GRANT_KEY}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
  notifications:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com,https://auctions.westus2.cloudapp.azure.com:8081
      ConnectionStrings__Notifications: "Host=postgres;Database=eauction_notifications;Username=eauction;Password=${POSTGRES_PASSWORD}"
    restart: unless-stopped
  audit:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com:8081
      ConnectionStrings__Audit: "Host=postgres;Database=eauction_audit;Username=eauction;Password=${POSTGRES_PASSWORD}"
    restart: unless-stopped
  reporting:
    environment:
      Jwt__Issuer: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
      Jwt__Authority: http://keycloak:8080/auth/realms/eauction
      Cors__AllowedOrigins: https://auctions.westus2.cloudapp.azure.com:8081
      ConnectionStrings__Reporting: "Host=postgres;Database=eauction_reporting;Username=eauction;Password=${POSTGRES_PASSWORD}"
    restart: unless-stopped
  bidder-portal:
    build:
      args:
        VITE_ISSUER: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
        VITE_ADMIN_API: https://auctions.westus2.cloudapp.azure.com/api/admin
        VITE_PARTICIPANT_API: https://auctions.westus2.cloudapp.azure.com/api/participant
        VITE_CATCHER_API: https://auctions.westus2.cloudapp.azure.com/api/catcher
        VITE_QUERY_API: https://auctions.westus2.cloudapp.azure.com/api/query
        VITE_DOCUMENTS_API: https://auctions.westus2.cloudapp.azure.com/api/documents
        VITE_NOTIFICATIONS_API: https://auctions.westus2.cloudapp.azure.com/api/notifications
        VITE_AUDIT_API: https://auctions.westus2.cloudapp.azure.com/api/audit
        VITE_REPORTING_API: https://auctions.westus2.cloudapp.azure.com/api/reporting
    restart: unless-stopped
  admin-portal:
    build:
      args:
        VITE_ISSUER: https://auctions.westus2.cloudapp.azure.com/auth/realms/eauction
        VITE_ADMIN_API: https://auctions.westus2.cloudapp.azure.com/api/admin
        VITE_PARTICIPANT_API: https://auctions.westus2.cloudapp.azure.com/api/participant
        VITE_CATCHER_API: https://auctions.westus2.cloudapp.azure.com/api/catcher
        VITE_QUERY_API: https://auctions.westus2.cloudapp.azure.com/api/query
        VITE_DOCUMENTS_API: https://auctions.westus2.cloudapp.azure.com/api/documents
        VITE_NOTIFICATIONS_API: https://auctions.westus2.cloudapp.azure.com/api/notifications
        VITE_AUDIT_API: https://auctions.westus2.cloudapp.azure.com/api/audit
        VITE_REPORTING_API: https://auctions.westus2.cloudapp.azure.com/api/reporting
    restart: unless-stopped
  keycloak:
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://auctions.westus2.cloudapp.azure.com/auth
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    healthcheck:
      # Keycloak lives under /auth here (KC_HTTP_RELATIVE_PATH), so the base file's /realms/eauction is a 404.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /auth/realms/eauction HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep 200"]
    restart: unless-stopped
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
  edge:
    image: nginx:1.27-alpine
    container_name: eauction-edge
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    - 8081:8081
    volumes:
    - ../vm/nginx-edge.conf:/etc/nginx/nginx.conf:ro
    - /home/auctionvmuser/eauction-tls/www:/var/www/acme:ro
    - /home/auctionvmuser/eauction-tls/etc:/etc/letsencrypt:ro
    depends_on:
      bidder-portal:
        condition: service_started
      admin-portal:
        condition: service_started
      keycloak:
        condition: service_started
      query-bff:
        condition: service_started
      bid-catcher:
        condition: service_started
      auction-admin:
        condition: service_started
      participant:
        condition: service_started
      documents:
        condition: service_started
      notifications:
        condition: service_started
      audit:
        condition: service_started
      reporting:
        condition: service_started
      sandbox:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - 'exec 3<>/dev/tcp/localhost/80 && printf ''GET /edge/health HTTP/1.1\r\nHost: x\r\nConnection:
        close\r\n\r\n'' >&3 && head -1 <&3 | grep 200'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  kafka:
    restart: unless-stopped
  kafka-connect:
    restart: unless-stopped
  bid-processor:
    restart: unless-stopped
  payments:
    restart: unless-stopped
  sandbox:
    restart: unless-stopped
