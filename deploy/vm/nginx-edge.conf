# The edge in front of the whole demo on auctions.westus2.cloudapp.azure.com.
#
# Why an edge at all, when compose already publishes a port per service: eleven
# public ports means eleven firewall rules, eleven origins in every CORS list,
# and a bundle whose URLs embed port numbers that change the moment anything
# moves. One hostname on port 80 means two rules and one origin.
#
# Two server blocks rather than two hostnames, because the VM has one DNS name:
#
#   :443   the bidder portal at /, the APIs under /api/, Keycloak at /auth/,
#          and صندوق التجارب at /sandbox/ (TLS)
#   :8081  the admin portal, which is staff-only (TLS)
#   :80    answers the Let's Encrypt challenge and redirects everything else to :443
#
# The admin portal gets a port instead of a path because neither portal sets
# Vite's `base`: a single-page app served under /admin/ would ask for its
# bundle at /assets/... and get the bidder's index.html back. A port costs one
# firewall rule; a base path would mean rebuilding both bundles differently.

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's embedded DNS, re-resolved rather than cached at startup. Without
  # the variable-in-proxy_pass form, nginx resolves each upstream once when it
  # loads its config: the first `docker compose up -d` of a service hands the
  # edge a stale container IP and every request 502s until nginx restarts too.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Authorization passes through untouched. Every service validates the bearer
  # token itself; this edge is not a trust boundary and must not look like one.
  proxy_set_header Connection "";

  client_max_body_size 64m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---------------------------------------------------------------- :80
  server {
    listen 80;
    server_name _;

    location = /edge/health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain always;
    }

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------------------------------------------------------- :443
  server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/auctions.westus2.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auctions.westus2.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    location = /edge/health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain always;
    }

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }

    # --- the eight APIs the browser calls -------------------------------
    #
    # Each strips its own prefix, so /api/query/auctions arrives at the
    # service as /auctions and no service knows the edge exists.

    location /api/admin/ {
      set $u http://auction-admin:8080;
      rewrite ^/api/admin/(.*)$ /$1 break;
      proxy_pass $u;
    }
    location /api/participant/ {
      set $u http://participant:8080;
      rewrite ^/api/participant/(.*)$ /$1 break;
      proxy_pass $u;
    }
    location /api/catcher/ {
      set $u http://bid-catcher:8080;
      rewrite ^/api/catcher/(.*)$ /$1 break;
      proxy_pass $u;
    }
    location /api/query/ {
      set $u http://query-bff:8080;
      rewrite ^/api/query/(.*)$ /$1 break;
      proxy_pass $u;

      # The live price feed is server-sent events. nginx buffers a proxied
      # response by default, which does not slow the stream — it holds it until
      # the buffer fills, so a bidder would see the closing price after the
      # auction closed. The service sends X-Accel-Buffering: no for this
      # reason; these make it unconditional and let a quiet stream stay open.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      chunked_transfer_encoding on;
    }
    location /api/documents/ {
      set $u http://documents:8080;
      rewrite ^/api/documents/(.*)$ /$1 break;
      proxy_pass $u;
      # A booklet or a plan photograph, not a JSON body.
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    location /api/notifications/ {
      set $u http://notifications:8080;
      rewrite ^/api/notifications/(.*)$ /$1 break;
      proxy_pass $u;
    }
    location /api/audit/ {
      set $u http://audit:8080;
      rewrite ^/api/audit/(.*)$ /$1 break;
      proxy_pass $u;
    }
    location /api/reporting/ {
      set $u http://reporting:8080;
      rewrite ^/api/reporting/(.*)$ /$1 break;
      proxy_pass $u;
    }

    # --- Keycloak -------------------------------------------------------
    #
    # Under /auth/ with KC_HTTP_RELATIVE_PATH set to match, so the issuer in
    # every token is this public URL. Not stripped: Keycloak must see /auth
    # itself, or the URLs it mints in its own discovery document lose the
    # prefix and the browser follows them to a 404.
    location /auth/ {
      set $u http://keycloak:8080;
      proxy_pass $u;
      proxy_read_timeout 120s;
    }

    # --- صندوق التجارب --------------------------------------------------
    #
    # The trailing slash matters: the page's fetches are relative ('api/nafath'
    # with no leading slash), so at /sandbox they would resolve against / and
    # miss the prefix entirely.
    location = /sandbox { return 301 /sandbox/; }
    location /sandbox/ {
      set $u http://sandbox:8080;
      rewrite ^/sandbox/(.*)$ /$1 break;
      proxy_pass $u;
    }

    # --- the bidder portal ----------------------------------------------
    #
    # Last, so every prefix above wins first. The portal's own nginx does the
    # single-page-app fallback, so a reload on /auction/<id> still works.
    location / {
      set $u http://bidder-portal:8080; proxy_pass $u;
    }
  }

  # ---------------------------------------------------------------- :8081
  server {
    listen 8081 ssl;
    ssl_certificate /etc/letsencrypt/live/auctions.westus2.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auctions.westus2.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    location = /edge/health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain always;
    }

    location / {
      set $u http://admin-portal:8080;  proxy_pass $u;
    }
  }
}
