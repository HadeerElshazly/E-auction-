# Serves one built portal, and nothing else.
#
# Listens on 8080 rather than 80 so the container needs no privileged port and can
# run as UID 10001 like every other image here.

worker_processes auto;

# Writable by the non-root user, and under /tmp so a read-only root filesystem
# still works with the chart's emptyDir mounts.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The bundle's own name carries its hash, so the browser should never ask twice.
  # index.html must not be cached at all: it is what names the current bundle, and
  # a cached one points at a bundle that has been deleted.
  map $uri $cache_control {
    default                    "no-cache";
    ~*^/assets/                "public, max-age=31536000, immutable";
  }

  server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;

    # The Content-Security-Policy is a meta tag in index.html, put there at build
    # time from the same endpoint table the bundle is built from
    # (web/shared/vite-csp.ts). It is not repeated here, because two copies of a
    # policy drift and the one that drifts is the one nobody tested.
    #
    # These three cannot be expressed in a meta tag at all, which is why they are
    # here and only here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Neither portal is ever framed. frame-ancestors is the modern form and is
    # ignored in a meta tag, so this is the only place it can be said.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    add_header Cache-Control $cache_control always;

    # The same two paths every other service in this platform serves, so the chart
    # needs no special case for a portal — one health contract, templated once in
    # e-auction-common.
    #
    # Both answer the same thing, because for nginx serving pre-built files they
    # are the same question: it is ready when it is listening. There is no warm-up,
    # no database and no topic to replay.
    location ~ ^/health/(live|ready)$ {
      access_log off;
      add_header Content-Type text/plain always;
      return 200 "ok\n";
    }

    # A single-page app: every path that is not a file is the app's own route, and
    # the app decides what it means. Without this, a reload on /auctions/<id> is a
    # 404 from nginx.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
