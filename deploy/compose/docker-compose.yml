# Local development stack.
#
# NOT YET RUN: the development container used to author this has no Docker
# daemon, so this file is unexercised. Treat the first `docker compose up` as
# part of the work, not as a regression.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d
#
# Configuration is env-var only (12-factor) so Compose and Helm share one
# source of truth.

name: e-auction

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: eauction-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft: no ZooKeeper. Single broker for development only — deployment
      # runs 3 brokers with RF=3 and min.insync.replicas=2 (D-10).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created by the admin workflow before an auction is
      # published to auctions.upcoming (§5), never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: eauction-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eauction
      POSTGRES_PASSWORD: eauction
      POSTGRES_DB: eauction
      # Debezium reads the WAL for the transactional outbox (D-16).
      POSTGRES_INITDB_ARGS: "-c wal_level=logical"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # POSTGRES_DB creates eauction only; the participant service has its own
      # database because a national ID must not share a schema with the auction
      # catalogue that feeds public read paths.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready answers before the init scripts have run, so name the database
      # the migration job needs rather than the default one.
      test: ["CMD-SHELL", "pg_isready -U eauction -d eauction_participant"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: eauction-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: eauction
      MINIO_ROOT_PASSWORD: eauction123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: eauction-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      # Read-only: the import runs at startup, and a realm edited through the admin
      # console must not write back over the file that is the source of truth.
      - ../keycloak/eauction-realm.json:/opt/keycloak/data/import/eauction-realm.json:ro
    healthcheck:
      # Checks the eauction realm, not master. Master answers before the import has
      # finished, which would let the services start against a realm that does not
      # exist yet and fail every token for the first few seconds.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/eauction HTTP/1.1\\nHost: localhost\\n\\n' >&3 && cat <&3 | head -1 | grep 200"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Kafka Connect with Debezium, for the auction-admin outbox. The service can
  # also run its own polling relay instead — run one or the other, never both.
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: eauction-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: eauction-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      ADMIN_DB_HOST: postgres
      ADMIN_DB_USER: eauction
      ADMIN_DB_PASSWORD: eauction
      ADMIN_DB_NAME: eauction
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # The two steps that must finish before any service starts. Compose mirrors the
  # chart's pre-install hooks here (deploy/helm/e-auction/templates/provision.yaml):
  # topics first, because the outbox relays are ordered and cannot skip a message to
  # an unknown topic -- one missing topic stalls a relay while the service still
  # reports healthy -- then the migrations, which no service applies itself.
  #
  # Both are idempotent, so `docker compose up` after the first time is a no-op.
  provision-topics:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.provision
    container_name: eauction-provision-topics
    command:
      ["dotnet", "EAuction.Topics.dll",
       "--bootstrap", "kafka:9092", "--replication", "1", "--partitions", "1"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  provision-migrate:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.provision
    container_name: eauction-provision-migrate
    command: ["dotnet", "EAuction.Migrate.dll"]
    environment:
      ConnectionStrings__Admin: "Host=postgres;Database=eauction;Username=eauction;Password=eauction"
      # The same master key the catcher holds: the auction-admin service derives a
      # hall clerk's signing key from it (§29).
      Admin__BidderMasterKeyHex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      ConnectionStrings__Participant: "Host=postgres;Database=eauction_participant;Username=eauction;Password=eauction"
      ConnectionStrings__Notifications: "Host=postgres;Database=eauction_notifications;Username=eauction;Password=eauction"
    depends_on:
      postgres:
        condition: service_healthy
      provision-topics:
        condition: service_completed_successfully
    restart: "no"

  auction-admin:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.auctionadmin
    container_name: eauction-auction-admin
    ports:
      - "5090:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Admin: "Host=postgres;Database=eauction;Username=eauction;Password=eauction"
      Jwt__Authority: http://keycloak:8080/realms/eauction
      Jwt__Audience: eauction
      Jwt__RequireHttpsMetadata: "false"
      # The two portals run on :3000 and :3001. Default is no origins at all.
      Cors__AllowedOrigins: "http://localhost:3000,http://localhost:3001"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ReplicationFactor: "1"
      Award__ComplianceWindowDays: "5"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  participant:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.participant
    container_name: eauction-participant
    ports:
      - "5095:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Participant: "Host=postgres;Database=eauction_participant;Username=eauction;Password=eauction"
      Jwt__Authority: http://keycloak:8080/realms/eauction
      Jwt__Audience: eauction
      Jwt__RequireHttpsMetadata: "false"
      # The two portals run on :3000 and :3001. Default is no origins at all.
      Cors__AllowedOrigins: "http://localhost:3000,http://localhost:3001"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ReplicationFactor: "1"
      # Must match the catcher's: both derive each bidder's signing key from it,
      # and neither ever sends a derived secret to the other.
      Participant__BidderMasterKeyHex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      # The key the document service verifies grants with. Must match it.
      Documents__GrantKeyHex: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bid-catcher:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.bidcatcher
    container_name: eauction-bid-catcher
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Kafka__BootstrapServers: kafka:9092
      Jwt__Authority: http://keycloak:8080/realms/eauction
      Jwt__Audience: eauction
      Jwt__RequireHttpsMetadata: "false"
      # The two portals run on :3000 and :3001. Default is no origins at all.
      Cors__AllowedOrigins: "http://localhost:3000,http://localhost:3001"
      Catcher__PodOrdinal: "0"
      # The same master key the participant service holds.
      Catcher__BidderMasterKeyHex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      # Signs bid receipts (D-21). Development value: in a real deployment this is
      # a secret, like the master key above, and the service refuses to start in
      # production without one.
      Catcher__ReceiptKeyHex: "1f1e1d1c1b1a191817161514131211100f0e0d0c0b0a09080706050403020100"
      DOTNET_gcServer: "1"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # Public read model. No database: it rebuilds from the compacted control topics,
  # and it deliberately does not consume auctions.sealed, so the reserve price is
  # unreachable from the public read path by ACL rather than by care (D-23).
  query-bff:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.querybff
    container_name: eauction-query-bff
    ports:
      - "5094:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Authority: http://keycloak:8080/realms/eauction
      Jwt__Audience: eauction
      Jwt__RequireHttpsMetadata: "false"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ReplicationFactor: "1"
      Cors__AllowedOrigins: "http://localhost:3000,http://localhost:3001"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  bid-processor:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.bidprocessor
    container_name: eauction-bid-processor
    environment:
      Kafka__BootstrapServers: kafka:9092
      Processor__CloseGraceSeconds: "5"
      Processor__TickIntervalMs: "500"
      DOTNET_gcServer: "1"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # The money: the booklet fee, the deposit, brokerage on the award, and the
  # refunds and forfeitures at the end.
  #
  # Without it a bidder never becomes eligible — the deposit request sits on
  # participants.payments with nothing to answer it — so this is not an optional
  # component of a working stack.
  payments:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.payments
    container_name: eauction-payments
    environment:
      Kafka__BootstrapServers: kafka:9092
      # PayTabs and SADAD need merchant accounts the contract has not produced
      # (P-3), so a simulator stands behind the gateway seam. It settles
      # everything without taking a riyal, which is why the service refuses to
      # start on it in Production unless this says so explicitly.
      Payments__AllowSimulatedGateway: "true"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # The files: كراسة الشروط, the cover image, bank guarantees and award letters.
  #
  # It holds no database. Everything it knows about a document rides on the object
  # as S3 user metadata, so the bytes and the facts about them cannot be restored
  # out of step with each other.
  documents:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.documents
    container_name: eauction-documents
    ports:
      - "5096:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Authority: http://keycloak:8080/realms/eauction
      Jwt__Audience: eauction
      Jwt__RequireHttpsMetadata: "false"
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: eauction
      Storage__SecretKey: eauction123
      Storage__Bucket: eauction-documents
      # The same key auction-admin and the participant service mint grants with.
      # A development value, in the repository on purpose: it is worthless outside
      # this compose file, and the three services must agree or no bidder can open
      # the booklet they paid for.
      Documents__GrantKeyHex: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      Cors__AllowedOrigins: "http://localhost:3000,http://localhost:3001"
    depends_on:
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # What a bidder is told: eligible, outbid, awarded, deposit returned.
  #
  # The in-product inbox is the delivered channel. SMS and push both need
  # contracts that do not exist yet (P-7), so only the log channel is wired —
  # and unlike the payment gateway there is no production guard, because an
  # unsent SMS leaves the inbox working exactly as it should.
  notifications:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.notifications
    container_name: eauction-notifications
    ports:
      - "5097:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Authority: http://keycloak:8080/realms/eauction
      Jwt__Audience: eauction
      Jwt__RequireHttpsMetadata: "false"
      Kafka__BootstrapServers: kafka:9092
      ConnectionStrings__Notifications: "Host=postgres;Database=eauction_notifications;Username=eauction;Password=eauction"
      Cors__AllowedOrigins: "http://localhost:3000,http://localhost:3001"
    depends_on:
      provision-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # --- the portals ---------------------------------------------------------
  #
  # The service URLs are build arguments rather than environment variables, which
  # makes each image environment-specific. Vite inlines them and the
  # Content-Security-Policy is derived from the same table in the same build, so
  # one artifact for several environments needs both to become runtime concerns —
  # see docs/ARCHITECTURE.md §33 (D-43).
  #
  # Here they are localhost, because that is where a browser on the developer's
  # machine reaches these containers' published ports.

  bidder-portal:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.portal
      args:
        PORTAL: bidder
        VITE_ISSUER: http://localhost:8080/realms/eauction
        VITE_ADMIN_API: http://localhost:5090
        VITE_PARTICIPANT_API: http://localhost:5095
        VITE_CATCHER_API: http://localhost:5080
        VITE_QUERY_API: http://localhost:5094
        VITE_DOCUMENTS_API: http://localhost:5096
        VITE_NOTIFICATIONS_API: http://localhost:5097
    container_name: eauction-bidder-portal
    ports:
      - "3000:8080"
    depends_on:
      query-bff:
        condition: service_started

  admin-portal:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.portal
      args:
        PORTAL: admin
        VITE_ISSUER: http://localhost:8080/realms/eauction
        VITE_ADMIN_API: http://localhost:5090
        VITE_PARTICIPANT_API: http://localhost:5095
        VITE_CATCHER_API: http://localhost:5080
        VITE_QUERY_API: http://localhost:5094
        VITE_DOCUMENTS_API: http://localhost:5096
        VITE_NOTIFICATIONS_API: http://localhost:5097
    container_name: eauction-admin-portal
    ports:
      - "3001:8080"
    depends_on:
      auction-admin:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
