# Per-client overlay: Jeddah Municipality, Al-Saeed plan (مخطط السعيد).
#
# This is the pattern for a multi-client product — one chart, one overlay per
# client. Nothing client-specific belongs in values.yaml.

global:
  imageRegistry: eauctionacr.azurecr.io
  imagePullSecrets:
    - name: acr-pull

config:
  kafka:
    bootstrapServers: eauction-kafka-bootstrap.kafka.svc.cluster.local:9092

bidCatcher:
  # 372 plots across two phases, with lots closing together: size the floor
  # for the close, not the average.
  replicas: 4
  autoscaling:
    minReplicas: 4
    maxReplicas: 30
  expose:
    enabled: true
    host: mazad.jeddah.gov.sa
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 1k
      nginx.ingress.kubernetes.io/enable-cors: "false"
    tls:
      enabled: true
      secretName: mazad-jeddah-tls

auctionAdmin:
  replicas: 2
  secretEnv:
    - name: ConnectionStrings__Admin
      secretName: eauction-admin-db
      secretKey: connection-string
    # Mints grants for award letters; must match the document service's key.
    - name: Documents__GrantKeyHex
      secretName: eauction-document-grants
      secretKey: grant-key
  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    - name: Award__ComplianceWindowDays
      # Must match the كراسة الشروط the bidders accepted. Confirm with legal
      # before the first auction opens (§11, C-1).
      value: "5"

payments:
  # Payments__AllowSimulatedGateway is deliberately NOT set here.
  #
  # The simulator settles every charge without taking a riyal. Allowing it in
  # Jeddah would qualify every registered bidder in the country to bid on state
  # land, and would look exactly like a working deployment: deposits "paid",
  # bidders eligible, auctions running. The service refuses to start instead, and
  # that refusal is the only thing standing between a misconfigured install and
  # an auction with no money behind it.
  #
  # So this install does not start until the PayTabs / SADAD adapter exists and
  # its credentials are in a secret (P-3). The secretEnv below is the shape;
  # the names come from the adapter.
  secretEnv: []

documents:
  replicas: 2
  secretEnv:
    - name: Storage__AccessKey
      secretName: eauction-object-store
      secretKey: access-key
    - name: Storage__SecretKey
      secretName: eauction-object-store
      secretKey: secret-key
    # The same key auction-admin and the participant service mint grants with.
    # Three services, one secret: if they disagree, no bidder can open the booklet
    # they paid for and no winner can open their award letter.
    - name: Documents__GrantKeyHex
      secretName: eauction-document-grants
      secretKey: grant-key
  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    # The municipality's object store. Not defaulted anywhere: without it the
    # service refuses to start rather than holding a signed award letter in memory
    # and losing it on the next pod restart.
    - name: Storage__ServiceUrl
      value: http://minio.storage.svc.cluster.local:9000
    - name: Storage__Bucket
      value: eauction-documents
    - name: Documents__MaxUploadBytes
      value: "67108864"

participant:
  secretEnv:
    - name: ConnectionStrings__Participant
      secretName: eauction-participant-db
      secretKey: connection-string
    # The catcher derives the same per-bidder secret from this; neither service
    # ever sends a derived key to the other (D-20).
    - name: Participant__BidderMasterKeyHex
      secretName: eauction-bidder-keys
      secretKey: master-key
    # Mints grants for كراسة الشروط; must match the document service's key.
    - name: Documents__GrantKeyHex
      secretName: eauction-document-grants
      secretKey: grant-key
  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

notifications:
  secretEnv:
    - name: ConnectionStrings__Notifications
      secretName: eauction-notifications-db
      secretKey: connection-string
  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
  # No SMS adapter is configured, and none can be until an aggregator and a
  # registered sender name exist (P-7). The in-product inbox works regardless;
  # this is the line to change when that contract lands.
