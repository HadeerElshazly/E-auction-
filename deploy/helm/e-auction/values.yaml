# ---------------------------------------------------------------------------
# Which Kubernetes this is going on.
#
#   kubernetes  plain k8s, Rancher/RKE2, Tanzu  -> Ingress, explicit UID
#   openshift   Red Hat OpenShift / OKD         -> Route, SCC-assigned UID
#
# Nothing else changes between them. If you do not know which you have, ask
# the cluster team to run `oc version` — if `oc` exists at all, it is OpenShift.
# ---------------------------------------------------------------------------
platform: kubernetes

global:
  # Azure Container Registry. Leave empty to use bare image names.
  imageRegistry: ""
  imagePullSecrets: []

image:
  # Defaults to .Chart.AppVersion, so chart and images release as one.
  tag: ""
  pullPolicy: IfNotPresent

# Only read when platform is not openshift; OpenShift assigns the UID itself.
security:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

ingress:
  # Ignored on OpenShift, which routes through its own router.
  className: nginx

# Configuration shared by every service. Env vars only, so Compose and Helm
# stay one source of truth. Changing anything here rolls the pods.
config:
  kafka:
    bootstrapServers: eauction-kafka-bootstrap:9092

  # Keycloak realm. Every service validates tokens offline against this
  # issuer's cached signing keys — nothing calls it per request, so its
  # availability is not the auction's availability.
  jwt:
    authority: https://id.example.sa/realms/eauction
    audience: eauction

  # Origins the two portals are served from. Empty means no cross-origin access at
  # all, which is the default and the right one for a service no browser calls —
  # there is no wildcard option, because a wildcard origin on a bearer-token API
  # lets any page on the internet spend a signed-in bidder's session.
  cors:
    allowedOrigins: []
      # - https://mazad.jeddah.gov.sa
      # - https://mazad-admin.jeddah.gov.sa

# ---------------------------------------------------------------------------
# Provisioning: the steps that run once, before any pod rolls
#
# Neither can be done by the services at startup. Several replicas would race on
# the migration, and a schema change would run while the previous version is
# still serving. Topics must exist first: the outbox relays are ordered and
# cannot skip a message to an unknown topic, so one missing topic stalls a
# service's whole relay while the service itself still reports healthy.
#
# Both are Helm pre-install/pre-upgrade hooks and both are idempotent.
# ---------------------------------------------------------------------------
provision:
  image: e-auction/provision

  topics:
    enabled: true

    # Must not exceed the number of brokers, or topic creation fails. The tool
    # checks and refuses rather than leaving half the topics created.
    replicationFactor: 3

    # Control-plane volume is small; this is about consumer parallelism, not
    # throughput. Bid topics are always exactly one partition and are not
    # configurable — see src/EAuction.Core/Topics.cs.
    partitions: 3

  migrations:
    enabled: true

  # A failed hook blocks the release, which is the point. Two attempts covers a
  # broker or database that is still accepting connections but not yet ready.
  backoffLimit: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

bidCatcher:
  enabled: true
  image: e-auction/bid-catcher
  replicas: 3
  port: 8080

  expose:
    enabled: true
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Spread across nodes: losing one node mid-auction should not take the bid
  # path with it.
  spreadAcrossNodes: true

  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv:
    - name: Catcher__BidderMasterKeyHex
      secretName: eauction-bidder-master-key
      secretKey: master-key-hex
    # Signs bid receipts (D-21). A separate secret from the master key: it has a
    # different blast radius — leaking it forges evidence, leaking the master key
    # forges bids — and a receipt key can be rotated without invalidating every
    # bidder's signing key.
    - name: Catcher__ReceiptKeyHex
      secretName: eauction-bid-receipt-key
      secretKey: receipt-key-hex

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    - name: Catcher__MaxBidsPerSecondPerBidder
      value: "20"
    - name: Catcher__CeilingGraceSeconds
      value: "60"

bidProcessor:
  enabled: true
  image: e-auction/bid-processor
  # One instance: auctions are not yet sharded across processors, and two
  # would both drive the same auction (§14 "not yet done").
  replicas: 1
  port: null

  expose:
    enabled: false

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv: []

  env:
    - name: Processor__CloseGraceSeconds
      value: "5"
    - name: Processor__TickIntervalMs
      value: "500"
    - name: Processor__CheckpointEveryRecords
      value: "100"
    - name: Processor__CheckpointEverySeconds
      value: "2"

# The money: booklet fee, deposit, brokerage, refunds and forfeitures.
#
# Not optional. Without it a deposit request sits unanswered on
# participants.payments and no bidder ever becomes eligible, so the auction opens
# to an empty room.
payments:
  enabled: true
  image: e-auction/payments

  # One instance. Two would each replay the settlement log and then race on the
  # same request: the gateway's idempotency key stops that becoming two charges,
  # but it would still publish two settlements for one payment and leave the audit
  # trail saying something that did not happen. Sharding by auction is the way to
  # scale this, and it is not built.
  replicas: 1
  port: null

  expose:
    enabled: false

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  # Where the PayTabs / SADAD merchant credentials go when the contract produces
  # them (P-3): a secret reference, never a value in this file.
  #
  #   secretEnv:
  #     - name: Payments__PayTabs__ServerKey
  #       secret: eauction-paytabs
  #       key: server-key
  secretEnv: []

  env:
    # Deliberately absent, so that a production install fails to start rather
    # than settling every deposit without taking any money:
    #
    #   Payments__AllowSimulatedGateway: "true"
    #
    # Set it in a values override for a non-production environment. See
    # values-jeddah.yaml for the comment that says why it is not set there.
    []

participant:
  enabled: true
  image: e-auction/participant
  replicas: 2
  port: 8080

  # Internal by default: bidder traffic reaches it through the API gateway.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv:
    - name: ConnectionStrings__Participant
      secretName: eauction-participant-db
      secretKey: connection-string
    # The same master key the catcher holds. Both derive each bidder's signing
    # key from it, so no secret ever travels on a topic.
    - name: Participant__BidderMasterKeyHex
      secretName: eauction-bidder-master-key
      secretKey: master-key-hex

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

# Public read model. No database and no reserve price: it rebuilds from the
# compacted control topics and does not consume auctions.sealed (D-23).
#
# Scales out freely — every replica keeps its own full copy of a small read model,
# and nothing it serves is a write.
# ---------------------------------------------------------------------------
# The portals
#
# Static bundles behind nginx on :8080. Stateless, so they scale on request rate
# and nothing else, and both probes are the same static /healthz.
#
# Their service URLs are baked in at build time, which makes each image
# environment-specific — the tag here is the artifact for *this* environment and
# cannot be promoted from another. docs/ARCHITECTURE.md §33 (D-43) has the reason
# and the migration away from it.

bidderPortal:
  enabled: true
  image: e-auction/bidder
  replicas: 2
  port: 8080

  # The one surface a citizen reaches before signing in, so it faces the internet
  # alongside the query BFF.
  expose:
    enabled: true
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: true

  # Small: nginx serving pre-built files. The memory is for the file cache, not
  # for a runtime.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  secretEnv: []

  # Nothing. The bundle is already built, and its endpoints are inside it.
  env: []

adminPortal:
  enabled: true
  image: e-auction/admin
  replicas: 2
  port: 8080

  # Staff-only, so it does not face the internet: it reaches administrators and the
  # committee through whatever the municipality fronts internal applications with.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  secretEnv: []
  env: []

# What a bidder is told: eligible, outbid, awarded, deposit returned.
#
# Its own database, because its rows say which auctions a bidder is registered for,
# when they were outbid and what they won — the whole of what D-22 keeps off the
# public topics, assembled in one place.
notifications:
  enabled: true
  image: e-auction/notifications

  # One instance.
  #
  # Two is safe — the unique index on (bidder, auction, kind, dedup) is what
  # actually decides whether a notice has been sent, not an in-memory check — but
  # the outbid notice keeps the previous leader per auction in memory, so two
  # replicas would each hold half the picture and some outbid notices would be
  # missed rather than duplicated. Sharding by auction is the fix and it is not
  # built.
  replicas: 1
  port: 8080

  # Internal: the bidder portal reaches it through the API gateway.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  #   secretEnv:
  #     - name: ConnectionStrings__Notifications
  #       secretName: eauction-notifications-db
  #       secretKey: connection-string
  secretEnv: []

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

# The staff audit trail (D-44).
#
# A service of its own because the service that performs an action must not own the
# only record of it, and a database of its own because the trail has to survive the
# compromise of the services it records — it must not sit in a schema whose
# credentials auction-admin or the participant service hold.
#
# Read only by the `auditor` realm role, which is deliberately held by nobody who
# operates the platform. It has no endpoint that writes: entries arrive from Kafka
# and nowhere else, which makes "the trail cannot be edited through the API" a
# property of the code rather than of this file.
audit:
  enabled: true
  image: e-auction/audit

  # One instance, and here that is a correctness statement rather than a shrug.
  #
  # Two is safe: the offset is the primary key and every byte hashed comes from the
  # record, so two replicas reading the same topic compute the same hashes and the
  # loser of a race swallows a unique violation. But a second replica buys nothing —
  # the work is a few records per auction — while doubling the number of processes
  # that can be mid-append when something goes wrong. Raise it for availability of
  # the read API, not for throughput.
  replicas: 1
  port: 8080

  # Internal, and more firmly than the others. No portal reads the trail; an
  # auditor reaches it through the API gateway, which is where the `auditor` role
  # should also be checked a second time. Exposing this host publicly would put the
  # record of every staff action behind one role claim.
  #
  # Note that config.cors.allowedOrigins is shared by every service here, so the
  # portals' origins reach this one too. That is harmless — CORS governs what a
  # browser may do with a response, and no page on either portal calls this
  # service — but it is not the same thing as allowing nothing, which is what the
  # compose stack does. Give this service its own origin list if a portal is ever
  # built for it.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  # Never. Scaling out a hash-chained writer on load is how a trail acquires a gap.
  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  # The one credential that matters here, and the one that must not be shared with
  # the services this trail records:
  #
  #   secretEnv:
  #     - name: ConnectionStrings__Audit
  #       secretName: eauction-audit-db
  #       secretKey: connection-string
  secretEnv: []

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

# التقارير (§35).
#
# A read model assembled from four control topics, so it is the one stateful service
# here whose database can be dropped and rebuilt — restart it against an empty
# schema and the reports come back. It has its own database all the same, for a
# third reason after PDPL (participant) and separation of duty (audit): a report is
# a table scan with joins, and running it against the auction service's database
# would let a finance query compete with an approval workflow for the same locks.
#
# It never consumes auctions.sealed and must not be given that ACL (D-45). The
# reserve price is the one secret in this platform and a service whose output is
# spreadsheets is where a secret stops being one.
reporting:
  enabled: true
  image: e-auction/reporting

  # Two is safe here, unlike the audit and notification services.
  #
  # Every write is an upsert on a natural key and the outcome field never retreats,
  # so two replicas reading the same topics converge on the same rows — and the one
  # ledger table is keyed on the topic offset, so a settlement cannot be counted
  # twice. The service also serialises its own writes across the four topics it
  # follows, which is what stops one topic's handler losing another's update.
  replicas: 2
  port: 8080

  # Internal. The admin portal will render التقارير through the API gateway when it
  # has a screen for them; a CSV of every auction's winner and price is not a public
  # document.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  # Off, but not for a correctness reason — unlike the audit service, this one would
  # be safe to scale. It is off because reports are run by a handful of staff and a
  # report that is slow is slow because of a query plan, not a replica count.
  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  # More memory than the other read services and deliberately so: a revenue report
  # groups in memory over the settlements of every auction in range.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  #   secretEnv:
  #     - name: ConnectionStrings__Reporting
  #       secretName: eauction-reporting-db
  #       secretKey: connection-string
  secretEnv: []

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

# The files: كراسة الشروط, the cover image, bank guarantees and award letters.
#
# Holds no database. Everything it knows about a document rides on the object as S3
# user metadata, so a pod is disposable and replicas need no coordination.
documents:
  enabled: true
  image: e-auction/documents
  replicas: 2
  port: 8080

  # Internal by default. Both portals call it from a browser, so it reaches them
  # through the API gateway like the participant service does — and unlike the
  # query BFF, which is the one surface a citizen reaches before logging in.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # Higher than the other services': an upload is buffered in memory to hash it
    # on the way through, and a كراسة الشروط with site plans in it is tens of
    # megabytes. Documents:MaxUploadBytes is the other half of that bound.
    limits:
      memory: 1Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  # The object store's credentials and the grant key. Both are secrets, and the
  # grant key has to be the same one auction-admin and the participant service
  # hold — three services, one key, nothing derived from it ever published (the
  # same arrangement as the bidder master key, D-20).
  #
  #   secretEnv:
  #     - name: Storage__AccessKey
  #       secretName: eauction-object-store
  #       secretKey: access-key
  #     - name: Storage__SecretKey
  #       secretName: eauction-object-store
  #       secretKey: secret-key
  #     - name: Documents__GrantKeyHex
  #       secretName: eauction-document-grants
  #       secretKey: grant-key
  secretEnv: []

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    # Where the object store is. Deliberately not defaulted: the service refuses to
    # start in Production without it rather than holding documents in memory and
    # losing a signed award letter on the next pod restart.
    #
    #   - name: Storage__ServiceUrl
    #     value: http://minio.storage.svc.cluster.local:9000
    - name: Documents__MaxUploadBytes
      value: "67108864"

queryBff:
  enabled: true
  image: e-auction/query-bff
  replicas: 2
  port: 8080

  # The public catalogue is the one thing citizens reach before they log in, so
  # this is the service that faces the internet.
  expose:
    enabled: true
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: true

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv: []

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

auctionAdmin:
  enabled: true
  image: e-auction/auction-admin
  replicas: 2
  port: 8080

  # Internal by default: admin and committee traffic goes through the API
  # gateway, not straight at the service.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  # The connection string is a secret and never appears in values. Point this
  # at a Secret the cluster already holds — External Secrets Operator,
  # sealed-secrets, or one created out of band.
  secretEnv:
    - name: ConnectionStrings__Admin
      secretName: eauction-admin-db
      secretKey: connection-string
    # The same master key the catcher and the participant service hold. This
    # service derives a hall clerk's signing key from it (§29) and nothing else.
    - name: Admin__BidderMasterKeyHex
      secretName: eauction-bidder-master-key
      secretKey: master-key-hex

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    - name: Award__ComplianceWindowDays
      # A contract term from the كراسة الشروط, not a tuning knob (§11, C-1).
      value: "5"
