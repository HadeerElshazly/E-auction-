# ---------------------------------------------------------------------------
# Which Kubernetes this is going on.
#
#   kubernetes  plain k8s, Rancher/RKE2, Tanzu  -> Ingress, explicit UID
#   openshift   Red Hat OpenShift / OKD         -> Route, SCC-assigned UID
#
# Nothing else changes between them. If you do not know which you have, ask
# the cluster team to run `oc version` — if `oc` exists at all, it is OpenShift.
# ---------------------------------------------------------------------------
platform: kubernetes

global:
  # Azure Container Registry. Leave empty to use bare image names.
  imageRegistry: ""
  imagePullSecrets: []

image:
  # Defaults to .Chart.AppVersion, so chart and images release as one.
  tag: ""
  pullPolicy: IfNotPresent

# Only read when platform is not openshift; OpenShift assigns the UID itself.
security:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

ingress:
  # Ignored on OpenShift, which routes through its own router.
  className: nginx

# Configuration shared by every service. Env vars only, so Compose and Helm
# stay one source of truth. Changing anything here rolls the pods.
config:
  kafka:
    bootstrapServers: eauction-kafka-bootstrap:9092

  # Keycloak realm. Every service validates tokens offline against this
  # issuer's cached signing keys — nothing calls it per request, so its
  # availability is not the auction's availability.
  jwt:
    authority: https://id.example.sa/realms/eauction
    audience: eauction

  # Origins the two portals are served from. Empty means no cross-origin access at
  # all, which is the default and the right one for a service no browser calls —
  # there is no wildcard option, because a wildcard origin on a bearer-token API
  # lets any page on the internet spend a signed-in bidder's session.
  cors:
    allowedOrigins: []
      # - https://mazad.jeddah.gov.sa
      # - https://mazad-admin.jeddah.gov.sa

# ---------------------------------------------------------------------------
# Provisioning: the steps that run once, before any pod rolls
#
# Neither can be done by the services at startup. Several replicas would race on
# the migration, and a schema change would run while the previous version is
# still serving. Topics must exist first: the outbox relays are ordered and
# cannot skip a message to an unknown topic, so one missing topic stalls a
# service's whole relay while the service itself still reports healthy.
#
# Both are Helm pre-install/pre-upgrade hooks and both are idempotent.
# ---------------------------------------------------------------------------
provision:
  image: e-auction/provision

  topics:
    enabled: true

    # Must not exceed the number of brokers, or topic creation fails. The tool
    # checks and refuses rather than leaving half the topics created.
    replicationFactor: 3

    # Control-plane volume is small; this is about consumer parallelism, not
    # throughput. Bid topics are always exactly one partition and are not
    # configurable — see src/EAuction.Core/Topics.cs.
    partitions: 3

  migrations:
    enabled: true

  # A failed hook blocks the release, which is the point. Two attempts covers a
  # broker or database that is still accepting connections but not yet ready.
  backoffLimit: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

bidCatcher:
  enabled: true
  image: e-auction/bid-catcher
  replicas: 3
  port: 8080

  expose:
    enabled: true
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Spread across nodes: losing one node mid-auction should not take the bid
  # path with it.
  spreadAcrossNodes: true

  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv:
    - name: Catcher__BidderMasterKeyHex
      secretName: eauction-bidder-master-key
      secretKey: master-key-hex
    # Signs bid receipts (D-21). A separate secret from the master key: it has a
    # different blast radius — leaking it forges evidence, leaking the master key
    # forges bids — and a receipt key can be rotated without invalidating every
    # bidder's signing key.
    - name: Catcher__ReceiptKeyHex
      secretName: eauction-bid-receipt-key
      secretKey: receipt-key-hex

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    - name: Catcher__MaxBidsPerSecondPerBidder
      value: "20"
    - name: Catcher__CeilingGraceSeconds
      value: "60"

bidProcessor:
  enabled: true
  image: e-auction/bid-processor
  # One instance: auctions are not yet sharded across processors, and two
  # would both drive the same auction (§14 "not yet done").
  replicas: 1
  port: null

  expose:
    enabled: false

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv: []

  env:
    - name: Processor__CloseGraceSeconds
      value: "5"
    - name: Processor__TickIntervalMs
      value: "500"
    - name: Processor__CheckpointEveryRecords
      value: "100"
    - name: Processor__CheckpointEverySeconds
      value: "2"

# The money: booklet fee, deposit, brokerage, refunds and forfeitures.
#
# Not optional. Without it a deposit request sits unanswered on
# participants.payments and no bidder ever becomes eligible, so the auction opens
# to an empty room.
payments:
  enabled: true
  image: e-auction/payments

  # One instance. Two would each replay the settlement log and then race on the
  # same request: the gateway's idempotency key stops that becoming two charges,
  # but it would still publish two settlements for one payment and leave the audit
  # trail saying something that did not happen. Sharding by auction is the way to
  # scale this, and it is not built.
  replicas: 1
  port: null

  expose:
    enabled: false

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  # Where the PayTabs / SADAD merchant credentials go when the contract produces
  # them (P-3): a secret reference, never a value in this file.
  #
  #   secretEnv:
  #     - name: Payments__PayTabs__ServerKey
  #       secret: eauction-paytabs
  #       key: server-key
  secretEnv: []

  env:
    # Deliberately absent, so that a production install fails to start rather
    # than settling every deposit without taking any money:
    #
    #   Payments__AllowSimulatedGateway: "true"
    #
    # Set it in a values override for a non-production environment. See
    # values-jeddah.yaml for the comment that says why it is not set there.
    []

participant:
  enabled: true
  image: e-auction/participant
  replicas: 2
  port: 8080

  # Internal by default: bidder traffic reaches it through the API gateway.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv:
    - name: ConnectionStrings__Participant
      secretName: eauction-participant-db
      secretKey: connection-string
    # The same master key the catcher holds. Both derive each bidder's signing
    # key from it, so no secret ever travels on a topic.
    - name: Participant__BidderMasterKeyHex
      secretName: eauction-bidder-master-key
      secretKey: master-key-hex

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

# Public read model. No database and no reserve price: it rebuilds from the
# compacted control topics and does not consume auctions.sealed (D-23).
#
# Scales out freely — every replica keeps its own full copy of a small read model,
# and nothing it serves is a write.
queryBff:
  enabled: true
  image: e-auction/query-bff
  replicas: 2
  port: 8080

  # The public catalogue is the one thing citizens reach before they log in, so
  # this is the service that faces the internet.
  expose:
    enabled: true
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: true

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  secretEnv: []

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080

auctionAdmin:
  enabled: true
  image: e-auction/auction-admin
  replicas: 2
  port: 8080

  # Internal by default: admin and committee traffic goes through the API
  # gateway, not straight at the service.
  expose:
    enabled: false
    host: ""
    path: /
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

  # The connection string is a secret and never appears in values. Point this
  # at a Secret the cluster already holds — External Secrets Operator,
  # sealed-secrets, or one created out of band.
  secretEnv:
    - name: ConnectionStrings__Admin
      secretName: eauction-admin-db
      secretKey: connection-string
    # The same master key the catcher and the participant service hold. This
    # service derives a hall clerk's signing key from it (§29) and nothing else.
    - name: Admin__BidderMasterKeyHex
      secretName: eauction-bidder-master-key
      secretKey: master-key-hex

  env:
    - name: ASPNETCORE_URLS
      value: http://+:8080
    - name: Award__ComplianceWindowDays
      # A contract term from the كراسة الشروط, not a tuning knob (§11, C-1).
      value: "5"
