# Deploy the demo to namespace `e-auctions` on the staging k3s node.
#
# Manual only. This touches a cluster shared with another tenant whose own demo
# is frozen, so it is not something a push should start.
#
# The first job does nothing but try the SSH tunnel, because that is the one
# thing nobody has been able to test: the cloud session that wrote this has
# outbound port 22 blocked, so whether GitHub's runners can reach the VM is an
# open question. Finding out costs twenty seconds here and is the difference
# between a known blocker and a fifteen-minute build that fails at the end.
name: staging-deploy

on:
  workflow_dispatch:
    inputs:
      tunnel_check_only:
        description: "Only test the tunnel, deploy nothing"
        type: boolean
        default: false
      seed:
        description: "Run the demo seeder after deploying"
        type: boolean
        default: true

concurrency:
  # One deploy at a time. Two concurrent `helm upgrade` runs against one release
  # leave it in a pending state that needs a manual rollback.
  group: staging-deploy
  cancel-in-progress: false

env:
  NAMESPACE: e-auctions
  RELEASE: eauction
  REGISTRY: eauctionacr.azurecr.io
  VM_HOST: 40.64.120.210
  VM_USER: eauctions
  NODE_IP: 40.64.120.210

jobs:
  # ---------------------------------------------------------------------------
  tunnel:
    name: Can a runner reach the cluster?
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    steps:
      - name: Is port 22 open at all
        id: port
        run: |
          # Before the key, before kubectl: a plain TCP probe. If this fails the
          # cause is a firewall — the VM's network security group, or GitHub's
          # egress — and no amount of SSH configuration will change it.
          if timeout 10 bash -c "cat </dev/null >/dev/tcp/${VM_HOST}/22" 2>/dev/null; then
            echo "port 22 is open from this runner"
          else
            echo "::error::TCP ${VM_HOST}:22 is not reachable from a GitHub runner."
            echo "::error::Give the owner this runner's egress IP for the Azure NSG:"
            curl -sS --max-time 10 https://api.ipify.org || true
            exit 1
          fi

      - name: Open the tunnel and ask the API server who we are
        id: probe
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh ~/.kube && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_staging   && chmod 600 ~/.ssh/id_staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts  && chmod 600 ~/.ssh/known_hosts
          printf '%s'   "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config

          # ExitOnForwardFailure matters: without it ssh happily connects and
          # the forward silently fails, and the first kubectl call is what
          # tells you — badly.
          ssh -i ~/.ssh/id_staging -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=30 -o ConnectTimeout=15 \
              -N -L 6443:127.0.0.1:6443 "${VM_USER}@${VM_HOST}" &
          echo $! > /tmp/tunnel.pid

          for i in $(seq 1 20); do
            kubectl version -o json >/dev/null 2>&1 && break
            sleep 1
          done

          echo "--- server version"
          kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])'
          echo "--- our rights in ${NAMESPACE}"
          kubectl -n "$NAMESPACE" auth can-i create deployments
          echo "--- the quota we have to fit in"
          kubectl -n "$NAMESPACE" get resourcequota -o wide || true
          echo "--- and confirm we cannot see the neighbour (Forbidden is the pass)"
          if kubectl get pods -n sdaia-archive >/dev/null 2>&1; then
            echo "::error::We can read namespace sdaia-archive. The token is wider than it should be; stopping."
            exit 1
          else
            echo "sdaia-archive: Forbidden, as expected"
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"

      - name: Close the tunnel
        if: always()
        run: '[ -f /tmp/tunnel.pid ] && kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true'

  # ---------------------------------------------------------------------------
  build:
    name: Build, test and push images
    needs: tunnel
    if: ${{ !inputs.tunnel_check_only }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test the backend
        run: |
          # Kafka's suite is skipped without a broker, which is deliberate: run
          # against a broker that has the bid processor attached and it fails
          # for reasons that have nothing to do with the change under test.
          dotnet test EAuction.sln --nologo -v q

      - name: Check the portals
        working-directory: web
        run: |
          # ci, not install: a package.json that has drifted from the lockfile
          # must fail here. A missing dependency was exactly how the last branch
          # broke, and `install` would have quietly fixed it.
          #
          # No `npm run build` here. Dockerfile.portal does its own `npm ci` and
          # its own vite build from the VITE_* build args below, and a bundle
          # built in this step would be thrown away. What this step is for is
          # the typecheck and the unit tests, which the image build does not run.
          npm ci
          npm run typecheck
          npm test

      - name: Pick a tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        run: |
          # Username and password because that is what a docker-registry pull
          # secret needs. For pushing, a federated OIDC identity (azure/login
          # then `az acr login`) would be better and leaves no long-lived
          # credential in the repository — worth moving to once this works.
          echo "${{ secrets.ACR_PASSWORD }}" \
            | docker login "$REGISTRY" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # name:dockerfile
          for pair in \
            auction-admin:Dockerfile.auctionadmin \
            participant:Dockerfile.participant \
            bid-catcher:Dockerfile.bidcatcher \
            bid-processor:Dockerfile.bidprocessor \
            query-bff:Dockerfile.querybff \
            payments:Dockerfile.payments \
            documents:Dockerfile.documents \
            notifications:Dockerfile.notifications \
            audit:Dockerfile.audit \
            reporting:Dockerfile.reporting \
            sandbox:Dockerfile.sandbox \
            provision:Dockerfile.provision \
            seed:Dockerfile.seed
          do
            name="${pair%%:*}"; file="${pair##*:}"
            echo "::group::$name"
            docker build -f "deploy/compose/$file" -t "$REGISTRY/e-auction/$name:$TAG" .
            docker push "$REGISTRY/e-auction/$name:$TAG"
            echo "::endgroup::"
          done

          # The portals are one image each, from the same Dockerfile.
          #
          # Every URL the browser will call is baked into the bundle here, and
          # the Dockerfile fails the build if one is missing rather than
          # shipping a portal whose Content-Security-Policy still permits
          # localhost. They point at the gateway's NodePort because that is the
          # address a browser outside the cluster can actually reach.
          GW="http://${NODE_IP}:30083"
          for p in bidder admin; do
            echo "::group::$p-portal"
            docker build -f deploy/compose/Dockerfile.portal \
              --build-arg PORTAL="$p" \
              --build-arg VITE_ISSUER="http://${NODE_IP}:30082/realms/eauction" \
              --build-arg VITE_ADMIN_API="$GW/api/admin" \
              --build-arg VITE_PARTICIPANT_API="$GW/api/participant" \
              --build-arg VITE_CATCHER_API="$GW/api/catcher" \
              --build-arg VITE_QUERY_API="$GW/api/query" \
              --build-arg VITE_DOCUMENTS_API="$GW/api/documents" \
              --build-arg VITE_NOTIFICATIONS_API="$GW/api/notifications" \
              --build-arg VITE_AUDIT_API="$GW/api/audit" \
              --build-arg VITE_REPORTING_API="$GW/api/reporting" \
              -t "$REGISTRY/e-auction/$p-portal:$TAG" .
            docker push "$REGISTRY/e-auction/$p-portal:$TAG"
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [tunnel, build]
    if: ${{ !inputs.tunnel_check_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Open the tunnel
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh ~/.kube && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_staging  && chmod 600 ~/.ssh/id_staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          printf '%s'   "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          ssh -i ~/.ssh/id_staging -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=30 -o ConnectTimeout=15 \
              -N -L 6443:127.0.0.1:6443 "${VM_USER}@${VM_HOST}" &
          echo $! > /tmp/tunnel.pid
          for i in $(seq 1 20); do kubectl version -o json >/dev/null 2>&1 && break; sleep 1; done
          kubectl -n "$NAMESPACE" get all >/dev/null

      - name: The chart's own portability tests
        run: ./deploy/helm/test-chart.sh

      - name: Render everything, then assert what the namespace will refuse
        run: |
          set -euo pipefail
          helm lint deploy/helm/e-auction -f deploy/helm/e-auction/values-staging.yaml

          helm template "$RELEASE" deploy/helm/e-auction \
            -f deploy/helm/e-auction/values-staging.yaml \
            -n "$NAMESPACE" --set image.tag="${{ needs.build.outputs.tag }}" > /tmp/rendered.yaml

          sed "s|IMAGE_PLACEHOLDER|${REGISTRY}/e-auction/sandbox:${{ needs.build.outputs.tag }}|" \
            deploy/staging/dependencies.yaml > /tmp/deps.yaml

          # Eleven assertions, each matching a limit in the access note: nothing
          # cluster-scoped, no Ingress, no LoadBalancer, at most five NodePorts
          # and never the archive's two, a CPU and memory limit on every
          # container, no PDB or autoscaler, bid-processor pinned at one, Pod
          # Security baseline, no credential in the output, and the CPU budget.
          # The script is negative-tested: it fails when a guard is removed.
          ./deploy/staging/check-render.sh /tmp/rendered.yaml /tmp/deps.yaml deploy/staging/api-gateway.yaml

      - name: Validate against the cluster's own schemas
        run: |
          set -euo pipefail
          # 1.33 to match the node's k3s. Strict, so an unknown field is an
          # error rather than something the API server silently drops.
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          "$(go env GOPATH)/bin/kubeconform" -kubernetes-version 1.33.0 -strict -summary \
            /tmp/rendered.yaml /tmp/deps.yaml deploy/staging/api-gateway.yaml

      - name: Secrets, created once and kept
        run: ./deploy/staging/secrets.sh

      - name: The Keycloak realm
        run: |
          # The same realm file the local stack imports, so the two cannot drift.
          kubectl -n "$NAMESPACE" create configmap keycloak-realm \
            --from-file=eauction-realm.json=deploy/keycloak/eauction-realm.json \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Kafka, Postgres, Keycloak, MinIO, sandbox
        run: |
          set -euo pipefail
          # The sandbox is the only one of these whose image we build, so its
          # tag is substituted here rather than hard-coded in the manifest.
          sed "s|IMAGE_PLACEHOLDER|${REGISTRY}/e-auction/sandbox:${{ needs.build.outputs.tag }}|" \
            deploy/staging/dependencies.yaml | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" apply -f deploy/staging/api-gateway.yaml

          # The chart's pre-install hooks create topics and run migrations, so
          # Kafka and Postgres have to be serving before Helm starts.
          kubectl -n "$NAMESPACE" rollout status deploy/postgres    --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/kafka       --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/minio       --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/api-gateway --timeout=180s
          # Keycloak last and with the longest timeout: it imports the realm on
          # every boot, because start-dev keeps it in memory.
          kubectl -n "$NAMESPACE" rollout status deploy/keycloak    --timeout=600s

      - name: The pull secret
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry acr-pull \
            --docker-server="$REGISTRY" \
            --docker-username="${{ secrets.ACR_USERNAME }}" \
            --docker-password="${{ secrets.ACR_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: helm upgrade --install
        run: |
          # --wait, but not with --atomic: a rollback on a first install deletes
          # the release and takes the evidence with it. On a failure here the
          # pods and the hook logs are what explain why, so they stay.
          helm upgrade --install "$RELEASE" deploy/helm/e-auction \
            -f deploy/helm/e-auction/values-staging.yaml \
            -n "$NAMESPACE" \
            --set image.tag="${{ needs.build.outputs.tag }}" \
            --wait --timeout 15m

      - name: The sandbox, once payments exists
        run: |
          # Checked after the release, not with the other dependencies: the
          # sandbox reads the payment service's state, and that Service is
          # created by the chart.
          kubectl -n "$NAMESPACE" rollout status deploy/sandbox --timeout=300s

      - name: What came up
        if: always()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          echo "--- anything not Running or Completed"
          kubectl -n "$NAMESPACE" get pods \
            --field-selector=status.phase!=Running,status.phase!=Succeeded -o wide || true
          echo "--- recent events, which is where a quota refusal appears"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30 || true

      - name: Seed the demo
        if: ${{ inputs.seed }}
        run: |
          # The seeder publishes events rather than calling the API, because
          # auction-admin refuses a start date in the past and a seeded plan is
          # history by definition.
          #
          # Its own image: deploy/compose/Dockerfile.provision builds the topics
          # tool and the migration runner and nothing else, so running the
          # seeder from that image would fail on a missing assembly.
          kubectl -n "$NAMESPACE" delete job eauction-seed --ignore-not-found
          kubectl -n "$NAMESPACE" create job eauction-seed \
            --image="$REGISTRY/e-auction/seed:${{ needs.build.outputs.tag }}" \
            -- dotnet eauction-seed.dll \
               --kafka "kafka.${NAMESPACE}.svc.cluster.local:9092"
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/eauction-seed --timeout=300s \
            || { kubectl -n "$NAMESPACE" logs job/eauction-seed --tail=50; exit 1; }

      - name: Where to click
        run: |
          echo "bidder   http://${NODE_IP}:30080"
          echo "admin    http://${NODE_IP}:30081"
          echo "keycloak http://${NODE_IP}:30082"
          echo "api      http://${NODE_IP}:30083/gateway/health"
          echo "sandbox  http://${NODE_IP}:30083/sandbox/   <- open this FIRST"
          echo
          echo "Registering and paying a deposit are behind a second factor and"
          echo "the sandbox is the only place that code can be read."
          echo
          echo "Each of those four ports must be opened in the Azure network"
          echo "security group before a browser outside the VM can reach it."

      - name: Close the tunnel
        if: always()
        run: '[ -f /tmp/tunnel.pid ] && kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true'
